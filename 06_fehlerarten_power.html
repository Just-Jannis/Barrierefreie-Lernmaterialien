<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fehler 1. Art, Fehler 2. Art und Teststärke</title><style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:20px;color:#222}
.tool{max-width:900px;margin:auto;background:white;border:1px solid #ccc;border-radius:10px;padding:20px}
h1{margin-top:0} h2{margin-top:24px}
.steuerung{background:#f7f7f7;border:1px solid #ddd;border-radius:8px;padding:12px;margin:14px 0}
label{display:block;font-weight:bold;margin-top:10px}
input[type=range],select{width:100%;margin-top:5px}
button,select,input[type=number]{padding:8px;margin-top:8px}
button{cursor:pointer;margin-right:5px}
canvas{width:100%;height:auto;border:1px solid #999;background:white;margin-top:10px}
.werte{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.wert{background:#eee;border-radius:6px;padding:10px}
.wert strong{display:block;margin-bottom:4px}
.hinweis{background:#eef4ff;border-left:4px solid #3d6fd8;padding:10px;margin-top:12px}
.warnung{background:#fff2e7;border-left:4px solid #d9730d;padding:10px;margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ccc;padding:7px;text-align:left}
.punkt{display:inline-block;width:13px;height:13px;border-radius:50%;margin:2px;background:#2864dc}
.antwort{display:block;width:100%;text-align:left;margin-top:7px}
.richtig{background:#dff5e5}.falsch{background:#fde3e0}
@media(max-width:650px){.werte{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="tool"><h1>Fehler 1. Art, Fehler 2. Art und Teststärke</h1><p>Verändere Effekt, Stichprobengröße und Signifikanzniveau.</p>
<div class="steuerung">
<label for="effekt">Tatsächlicher Effekt: <span id="ea">1,0</span></label><input id="effekt" type="range" min="0" max="3" step="0.1" value="1">
<label for="n">Stichprobengröße: <span id="na">25</span></label><input id="n" type="range" min="5" max="100" value="25">
<label for="alpha">Signifikanzniveau</label><select id="alpha"><option value="1.282">10 %</option><option value="1.645" selected>5 %</option><option value="2.326">1 %</option></select>
</div>
<canvas id="c" width="820" height="360"></canvas>
<div class="werte"><div class="wert"><strong>Fehler 1. Art α</strong><span id="aw"></span></div><div class="wert"><strong>Fehler 2. Art β</strong><span id="bw"></span></div><div class="wert"><strong>Teststärke</strong><span id="pw"></span></div><div class="wert"><strong>Kritischer Wert</strong><span id="kw"></span></div></div>
<div class="warnung">Vereinfachtes Modell eines rechtsseitigen z-Tests.</div>
</div><script>
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x);const y=1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x);return s*y}
function Phi(z){return .5*(1+erf(z/Math.sqrt(2)))}
function dichte(x,m,s){return 1/(s*Math.sqrt(2*Math.PI))*Math.exp(-.5*Math.pow((x-m)/s,2))}

const c=document.getElementById("c"),ctx=c.getContext("2d"),e=document.getElementById("effekt"),n=document.getElementById("n"),a=document.getElementById("alpha");
function px(x){return 50+(x+4)/10*720} function py(y){return 320-y*500}
function kurve(m,f){ctx.strokeStyle=f;ctx.lineWidth=3;ctx.beginPath();let first=true;for(let x=-4;x<=6;x+=.05){let xx=px(x),yy=py(dichte(x,m,1));if(first){ctx.moveTo(xx,yy);first=false}else ctx.lineTo(xx,yy)}ctx.stroke()}
function update(){let d=Number(e.value),nn=Number(n.value),k=Number(a.value),versch=d*Math.sqrt(nn)/5,b=Phi(k-versch),p=1-b,ap=k<1.4?10:k<2?5:1;
 ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();ctx.moveTo(50,320);ctx.lineTo(770,320);ctx.strokeStyle="#777";ctx.stroke();kurve(0,"#2864dc");kurve(versch,"#198754");
 ctx.strokeStyle="#cc3333";ctx.beginPath();ctx.moveTo(px(k),35);ctx.lineTo(px(k),320);ctx.stroke();ctx.fillStyle="#222";ctx.fillText("H0",px(0)-10,80);ctx.fillText("H1",px(versch)-10,110);
 document.getElementById("ea").textContent=d.toFixed(1).replace(".",",");document.getElementById("na").textContent=nn;document.getElementById("aw").textContent=ap+" %";document.getElementById("bw").textContent=(b*100).toFixed(1).replace(".",",")+" %";document.getElementById("pw").textContent=(p*100).toFixed(1).replace(".",",")+" %";document.getElementById("kw").textContent=k.toFixed(3).replace(".",",")}
e.oninput=update;n.oninput=update;a.onchange=update;update();
</script></body></html>
